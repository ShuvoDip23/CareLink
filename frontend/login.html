<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - CareLink</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="site-nav">
    <div class="container nav-inner">
      <a href="index.html" class="nav-brand" aria-label="CareLink home">
        <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M5 12h14"/></svg></span>
        <span class="brand-name">CareLink</span>
      </a>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Open menu" aria-controls="navMenu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html">Home</a></li>
        <li><a href="doctors.html">Find Doctors</a></li>
        <li id="navAppointments" style="display:none;"><a href="appointments.html">Appointments</a></li>
        <li id="navAdmin" style="display:none;"><a href="admin_add_doctor.html">Admin</a></li>
        <li id="navLogin"><a href="login.html" class="active">Login</a></li>
        <li id="navRegister" class="nav-cta"><a href="register.html">Register</a></li>
        <li id="navUser" style="display:none;"></li>
        <li id="navLogout" class="nav-logout" style="display:none;"><a href="#" onclick="logoutUser(); return false;">Logout</a></li>
      </ul>
    </div>
  </nav>

  <main class="auth-page">
    <div class="container auth-layout">
      <section class="auth-card">
        <div class="auth-card-header">
          <span class="auth-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15v2M6 10V8a6 6 0 1 1 12 0v2M5 10h14v11H5z"/></svg></span>
          <span class="eyebrow">Secure access</span>
          <h1>Welcome back</h1>
          <p>Sign in to continue to your CareLink workspace.</p>
        </div>
        <div id="alertBox" class="alert" role="alert"></div>

        <form id="loginForm" class="auth-form">
          <div class="account-toggle" role="group" aria-label="Login role">
            <button type="button" id="patientLoginTypeBtn" class="active" data-login-role="patient">Patient</button>
            <button type="button" id="doctorLoginTypeBtn" data-login-role="doctor">Doctor</button>
          </div>
          <input type="hidden" id="loginRole" value="patient" />

          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password" />
          </div>
          <button type="submit" id="loginButton" class="btn btn-primary btn-block">Sign in</button>
        </form>

        <p class="auth-switch">
          New to CareLink? <a href="register.html">Create an account</a>
        </p>
      </section>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
