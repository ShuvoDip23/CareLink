<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - CareLink</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="site-nav">
    <div class="container nav-inner">
      <a href="index.html" class="nav-brand" aria-label="CareLink home">
        <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M5 12h14"/></svg></span>
        <span class="brand-name">CareLink</span>
      </a>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Open menu" aria-controls="navMenu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html">Home</a></li>
        <li><a href="doctors.html">Find Doctors</a></li>
        <li id="navAppointments" style="display:none;"><a href="appointments.html">Appointments</a></li>
        <li id="navAdmin" style="display:none;"><a href="admin_add_doctor.html">Admin</a></li>
        <li id="navLogin"><a href="login.html">Login</a></li>
        <li id="navRegister" class="nav-cta"><a href="register.html" class="active">Register</a></li>
        <li id="navUser" style="display:none;"></li>
        <li id="navLogout" class="nav-logout" style="display:none;"><a href="#" onclick="logoutUser(); return false;">Logout</a></li>
      </ul>
    </div>
  </nav>

  <main class="auth-page">
    <div class="container auth-layout auth-layout-wide">
      <section class="auth-card register-card">
        <div class="auth-card-header">
          <span class="auth-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M5 12h14"/></svg></span>
          <span class="eyebrow">Join CareLink</span>
          <h1>Create account</h1>
          <p>Choose patient access or submit a doctor profile for approval.</p>
        </div>
        <div id="alertBox" class="alert" role="alert"></div>

        <form id="registerForm" class="auth-form">
          <div class="account-toggle" role="group" aria-label="Account type">
            <button type="button" id="patientTypeBtn" class="active" data-account-type="patient">Patient</button>
            <button type="button" id="doctorTypeBtn" data-account-type="doctor">Doctor</button>
          </div>
          <input type="hidden" id="accountType" value="patient" />

          <div class="form-grid">
            <div class="form-group">
              <label for="name">Full name</label>
              <input id="name" name="name" type="text" autocomplete="name" required placeholder="Your full name" />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="Minimum 6 characters" />
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required placeholder="Repeat password" />
            </div>
          </div>

          <div id="doctorFields" class="form-grid" style="display:none;">
            <div class="form-group">
              <label for="specialty">Specialty</label>
              <input id="specialty" name="specialty" type="text" placeholder="Cardiologist" />
            </div>
            <div class="form-group">
              <label for="hospital">Hospital or clinic</label>
              <input id="hospital" name="hospital" type="text" placeholder="Square Hospital" />
            </div>
            <div class="form-group">
              <label for="location">Location</label>
              <input id="location" name="location" type="text" placeholder="Dhaka" />
            </div>
            <div class="form-group">
              <label for="phone">Phone</label>
              <input id="phone" name="phone" type="tel" placeholder="+8801XXXXXXXXX" />
            </div>
            <div class="form-group">
              <label for="fee">Consultation fee</label>
              <input id="fee" name="fee" type="number" min="0" step="50" placeholder="1500" />
            </div>
            <div class="form-group">
              <label for="experienceYears">Years of experience</label>
              <input id="experienceYears" name="experienceYears" type="number" min="0" max="60" step="1" placeholder="8" />
            </div>
            <div class="form-group full">
              <label for="qualification">Qualification or license info</label>
              <textarea id="qualification" name="qualification" rows="3" placeholder="MBBS, FCPS, BMDC registration or relevant license"></textarea>
            </div>
          </div>

          <button type="submit" id="registerButton" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="auth-switch">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </section>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
